name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        asyncssh: ['2.24.0', '2.24.1']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt "asyncssh==${{ matrix.asyncssh }}"
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/release.py check --require-metadata
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: 'false'
